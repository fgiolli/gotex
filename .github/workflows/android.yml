name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Probar y exportar APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar plantillas de exportación
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Importar proyecto
        run: godot --headless --import . || true

      - name: Ejecutar el juego unos segundos (detectar errores)
        run: |
          godot --headless --path . --quit-after 600 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" run.log; then
            echo "Se encontraron errores de script"; exit 1
          fi
          grep "Gotex listo" run.log

      - name: Prueba automática de controles táctiles
        run: |
          timeout 300 godot --headless --path . -- --autotest 2>&1 | tee test.log || true
          if grep -E "SCRIPT ERROR|Parse Error" test.log; then exit 1; fi
          grep "AUTOTEST PASS" test.log

      - name: Capturas de pantalla (pantalla virtual, resolución de celular)
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq xvfb xauth libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p screenshots
          timeout 600 xvfb-run -a -s "-screen 0 2400x1080x24" godot --path . --rendering-driver opengl3 --resolution 2400x1080 -- --autotest --shots=$PWD/screenshots 2>&1 | tee shots.log || true
          grep AUTOTEST shots.log || true
          ls -la screenshots

      - name: Subir capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: screenshots/
          if-no-files-found: warn

      - name: Exportar APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/GotexOnline.apk
          ls -la build/android

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GotexOnline-apk
          path: build/android/GotexOnline.apk

  release:
    name: Publicar descarga
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GotexOnline-apk
      - name: Crear release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotex Online (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            APK de Gotex Online para Android. Descárgalo desde el celular, ábrelo y permite "instalar apps de origen desconocido".
          files: GotexOnline.apk
          make_latest: true
